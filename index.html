<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANGLE OF THE SHIFT // Analog Hardware & Custom DSP Lab</title>
<style>
  :root {
    --chassis-dark: #1d1f21;
    --screen-bg: #07120e;
    --vfd-cyan: #2cf5c6;
    --vfd-amber: #ffaa1d;
    --led-red: #ff2a2a;
    --led-green: #24ff4b;
    --ink-dark: #141618;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #16181a;
    color: #e2e5e8;
    font-family: "Courier New", Courier, "Lucida Console", monospace;
    font-size: 14px;
    line-height: 1.5;
    padding: 18px 10px 40px;
  }

  .rack-unit {
    max-width: 960px;
    margin: 0 auto;
    background: var(--chassis-dark);
    border: 3px solid #090a0b;
    border-radius: 6px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.15);
    overflow: hidden;
  }

  .faceplate-alu {
    background: linear-gradient(180deg, #dfe2e5 0%, #c4c9ce 48%, #aeb4ba 52%, #c9ced3 100%);
    color: var(--ink-dark);
    padding: 18px 24px 20px;
    border-bottom: 4px solid #0b0c0d;
    position: relative;
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.8), inset 0 -2px 4px rgba(0,0,0,0.35);
  }

  .screw {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f0f2f4, #6c7278);
    border: 1px solid #2b2e31;
    box-shadow: 0 1px 2px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.7);
    position: absolute;
  }
  .screw::after {
    content: "";
    position: absolute;
    top: 6px;
    left: 2px;
    width: 8px;
    height: 1.5px;
    background: #2b2e31;
    transform: rotate(-35deg);
  }
  .screw.tl { top: 10px; left: 10px; }
  .screw.tr { top: 10px; right: 10px; }
  .screw.bl { bottom: 10px; left: 10px; }
  .screw.br { bottom: 10px; right: 10px; }

  .top-badges {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding: 0 12px;
    color: #2c3035;
  }

  .gost-stamp {
    border: 1.5px solid #2c3035;
    padding: 1px 6px;
    border-radius: 2px;
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  .brand-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    padding: 0 12px;
  }

  .brand-title h1 {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #111315;
    text-shadow: 0 1px 0 rgba(255,255,255,0.7);
    line-height: 1.1;
  }

  .brand-sub {
    font-size: 12px;
    font-weight: bold;
    color: #353a40;
    letter-spacing: 1.2px;
    margin-top: 4px;
  }

  .power-block {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(0,0,0,0.08);
    padding: 8px 12px;
    border-radius: 4px;
    border: 1px solid rgba(0,0,0,0.2);
  }

  .led-indicator {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #3a1111;
    border: 1px solid #111;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
    transition: 0.2s;
    display: inline-block;
  }

  .led-indicator.on-red {
    background: var(--led-red);
    box-shadow: 0 0 8px var(--led-red), 0 0 16px rgba(255,42,42,0.6), inset 0 1px 2px #fff;
  }

  .led-indicator.on-green {
    background: var(--led-green);
    box-shadow: 0 0 8px var(--led-green), 0 0 14px rgba(36,255,75,0.6), inset 0 1px 2px #fff;
  }

  .led-indicator.on-amber {
    background: var(--vfd-amber);
    box-shadow: 0 0 8px var(--vfd-amber), inset 0 1px 2px #fff;
  }

  .hw-btn {
    background: linear-gradient(180deg, #f2f4f6 0%, #cfd4d9 85%, #9aa0a6 100%);
    color: #141618;
    border: 1.5px solid #1e2022;
    border-radius: 3px;
    padding: 7px 14px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    box-shadow: 0 3px 0 #464b50, 0 4px 6px rgba(0,0,0,0.45), inset 0 1px 0 #ffffff;
    transition: transform 0.06s, box-shadow 0.06s;
    user-select: none;
  }

  .hw-btn:active, .hw-btn.pressed {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #464b50, 0 2px 3px rgba(0,0,0,0.4), inset 0 2px 4px rgba(0,0,0,0.25);
    background: linear-gradient(180deg, #c5cacf 0%, #dce0e4 100%);
  }

  .hw-btn-dark {
    background: linear-gradient(180deg, #3e4247 0%, #272a2e 85%, #191b1d 100%);
    color: #eef1f4;
    border: 1.5px solid #0b0c0d;
    box-shadow: 0 3px 0 #0e0f10, 0 4px 6px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
  }

  .hw-btn-dark:active, .hw-btn-dark.pressed {
    background: linear-gradient(180deg, #222528 0%, #31353a 100%);
    box-shadow: 0 1px 0 #0e0f10, inset 0 2px 5px rgba(0,0,0,0.6);
  }

  .hw-btn-amber {
    background: linear-gradient(180deg, #ffc44d 0%, #e69500 85%, #b37400 100%);
    color: #111;
    border: 1.5px solid #3d2600;
    box-shadow: 0 3px 0 #664200, 0 4px 8px rgba(0,0,0,0.5), inset 0 1px 0 #ffe6b3;
  }

  .selector-bar {
    background: #17191b;
    padding: 10px 20px;
    border-bottom: 2px solid #090a0b;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .module-section {
    padding: 22px 24px;
    border-bottom: 3px solid #101113;
    background: linear-gradient(180deg, #212427 0%, #1b1d20 100%);
    position: relative;
  }

  .module-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    border-bottom: 1px solid #383c42;
    padding-bottom: 8px;
    margin-bottom: 16px;
  }

  .module-title {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1.5px;
    color: #f0f3f6;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .module-code {
    background: #101214;
    color: var(--vfd-amber);
    border: 1px solid #3c4046;
    padding: 2px 7px;
    font-size: 11px;
    font-family: "Courier New", monospace;
  }

  .vfd-bezel {
    background: #0a0c0d;
    border: 3px solid #35393e;
    border-radius: 5px;
    padding: 14px;
    box-shadow: inset 0 4px 12px rgba(0,0,0,0.95), 0 1px 0 rgba(255,255,255,0.1);
  }

  .vfd-screen {
    background-color: var(--screen-bg);
    background-image:
      linear-gradient(rgba(44, 245, 198, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(44, 245, 198, 0.04) 1px, transparent 1px);
    background-size: 4px 4px;
    border: 1px solid #16382e;
    border-radius: 3px;
    padding: 14px;
    color: var(--vfd-cyan);
    text-shadow: 0 0 6px rgba(44, 245, 198, 0.55);
    margin-bottom: 14px;
  }

  .vfd-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 12px;
    margin-bottom: 10px;
    border-bottom: 1px dashed rgba(44, 245, 198, 0.25);
    padding-bottom: 8px;
  }

  .vfd-mode-badge {
    color: var(--vfd-amber);
    text-shadow: 0 0 6px rgba(255, 170, 29, 0.6);
    font-weight: bold;
  }

  .vu-container {
    display: grid;
    grid-template-columns: 36px 1fr 48px;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
    font-size: 11px;
  }

  .vu-bar {
    display: grid;
    grid-template-columns: repeat(24, 1fr);
    gap: 2px;
    height: 12px;
    background: #030806;
    padding: 2px;
    border: 1px solid #14332a;
  }

  .vu-seg {
    background: #0d261f;
    border-radius: 1px;
    transition: background 0.05s;
  }

  .vu-seg.active-cyan {
    background: var(--vfd-cyan);
    box-shadow: 0 0 5px var(--vfd-cyan);
  }

  .vu-seg.active-amber {
    background: var(--vfd-amber);
    box-shadow: 0 0 5px var(--vfd-amber);
  }

  .vu-seg.active-red {
    background: var(--led-red);
    box-shadow: 0 0 6px var(--led-red);
  }

  .deck-transport {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .transport-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .schematic-box {
    background: #121518;
    border: 1.5px solid #353a40;
    border-radius: 4px;
    padding: 12px;
    margin-top: 14px;
    overflow-x: auto;
  }

  .schematic-caption {
    font-size: 11px;
    color: #9aa1a8;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .release-box {
    background: linear-gradient(135deg, #292d32 0%, #1c1e21 100%);
    border: 2px solid #c99228;
    border-radius: 5px;
    padding: 18px;
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 20px;
    align-items: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  }

  .cassette-art {
    background: #141517;
    border: 2px solid #454a50;
    border-radius: 6px;
    padding: 10px;
    text-align: center;
    box-shadow: inset 0 0 10px #000;
  }

  .release-info h3 {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 20px;
    color: #fff;
    margin-bottom: 6px;
  }

  .release-tag {
    display: inline-block;
    background: var(--vfd-amber);
    color: #111;
    font-weight: bold;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 2px;
    margin-bottom: 8px;
  }

  .buy-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed #454a50;
  }

  .price-tag {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: var(--vfd-cyan);
    text-shadow: 0 0 8px rgba(44,245,198,0.35);
  }

  .grid-2 {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 14px;
  }
