function updateMeters(levelL, levelR) {
const leftSegs = document.getElementById("vu-left").children;
const rightSegs = document.getElementById("vu-right").children;
for (let i = 0; i < 24; i++) {
leftSegs[i].className = "vu-seg";

}

// Built-in WebAudio Analog Drum Beat Simulator (active until MP3 is added)
function triggerDrumHit(type) {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
if (audioCtx.state === "suspended") audioCtx.resume();
const now = audioCtx.currentTime;
const osc = audioCtx.createOscillator();
const gain = audioCtx.createGain();
const shaper = audioCtx.createWaveShaper();
const amount = currentMode === "WET" ? 45 : 0;
const curve = new Float32Array(256);
for (let i = 0; i < 256; i++) {
const x = (i * 2) / 256 - 1;
curve[i] = amount > 0 ? ((3 + amount) * x * 20 * (Math.PI / 180)) / (Math.PI + amount * Math.abs(x)) : x;
}
shaper.curve = curve;
if (type === "KICK") {
osc.type = "sine";
osc.frequency.setValueAtTime(currentMode === "WET" ? 135 : 115, now);
osc.frequency.exponentialRampToValueAtTime(38, now + 0.16);
gain.gain.setValueAtTime(currentMode === "WET" ? 0.9 : 0.65, now);
gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
osc.connect(shaper);
shaper.connect(gain);
gain.connect(audioCtx.destination);
osc.start(now);
osc.stop(now + 0.25);
updateMeters(currentMode === "WET" ? 22 : 16, currentMode === "WET" ? 21 : 16);
} else if (type === "SNARE") {
const bufferSize = audioCtx.sampleRate * 0.16;
const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
const data = buffer.getChannelData(0);
for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
const noise = audioCtx.createBufferSource();
noise.buffer = buffer;
const filter = audioCtx.createBiquadFilter();
filter.type = "bandpass";
filter.frequency.value = currentMode === "WET" ? 1400 : 2200;
const nGain = audioCtx.createGain();
nGain.gain.setValueAtTime(currentMode === "WET" ? 0.75 : 0.45, now);
nGain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
noise.connect(filter);
filter.connect(shaper);
shaper.connect(nGain);
nGain.connect(audioCtx.destination);
noise.start(now);
updateMeters(currentMode === "WET" ? 23 : 17, currentMode === "WET" ? 22 : 15);
} else {
const bufferSize = audioCtx.sampleRate * 0.04;
const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
const data = buffer.getChannelData(0);
for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
const noise = audioCtx.createBufferSource();
noise.buffer = buffer;
const hGain = audioCtx.createGain();
hGain.gain.setValueAtTime(0.18, now);
hGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
noise.connect(hGain);
hGain.connect(audioCtx.destination);
noise.start(now);
updateMeters(currentMode === "WET" ? 13 : 9, currentMode === "WET" ? 14 : 9);
}
}
function togglePlay() {
if (isPlaying) {
stopAudio();
return;
}
isPlaying = true;
document.getElementById("btn-play").classList.add("pressed");
document.getElementById("led-play").className = "led-indicator on-green";
if (DEMO_AUDIO_URL) {
htmlAudio = new Audio(DEMO_AUDIO_URL);
htmlAudio.loop = true;
htmlAudio.play();
meterTimer = setInterval(() => {
const base = currentMode === "WET" ? 16 : 11;
updateMeters(base + Math.floor(Math.random() * 8), base + Math.floor(Math.random() * 8));
}, 90);
} else {
const pattern = ["KICK", "HAT", "SNARE", "HAT", "KICK", "KICK", "SNARE", "HAT"];
step = 0;
triggerDrumHit(pattern);
synthTimer = setInterval(() => {
step = (step + 1) % pattern.length;
triggerDrumHit(pattern[step]);
}, 240);
meterTimer = setInterval(() => {
const leftSegs = document.getElementById("vu-left").children;
let activeCount = 0;
for (let s of leftSegs) if (s.classList.length > 1) activeCount++;
if (activeCount > 2) updateMeters(activeCount - 2, activeCount - 2);
}, 65);
}
}
function stopAudio() {
isPlaying = false;
document.getElementById("btn-play").classList.remove("pressed");
document.getElementById("led-play").className = "led-indicator";
if (htmlAudio) {
htmlAudio.pause();
htmlAudio.currentTime = 0;
}
clearInterval(synthTimer);
clearInterval(meterTimer);
updateMeters(0, 0);
}
